name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Decode Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_PROPERTIES" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_PROPERTIES не заданы — APK будет с debug-подписью."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          printf '%s\n' "$KEY_PROPERTIES" > android/key.properties
          # storeFile резолвится из android/app/ — путь к jks в android/
          if grep -q '^storeFile=' android/key.properties; then
            sed -i 's|^storeFile=.*|storeFile=../upload-keystore.jks|' android/key.properties
          else
            echo 'storeFile=../upload-keystore.jks' >> android/key.properties
          fi

      - name: Build APK
        env:
          RUSTORE_PUSH_PROJECT_ID: ${{ secrets.RUSTORE_PUSH_PROJECT_ID }}
        run: |
          if [ -n "${RUSTORE_PUSH_PROJECT_ID:-}" ]; then
            flutter build apk --release -PRUSTORE_PUSH_PROJECT_ID="$RUSTORE_PUSH_PROJECT_ID"
          else
            echo "::warning::Секрет RUSTORE_PUSH_PROJECT_ID не задан — в APK попадёт placeholder Project ID."
            flutter build apk --release
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
